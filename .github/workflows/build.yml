name: Build firmware

on:
  push:
    branches: [main, tps65]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Keep the pinned upstream build procedure, adding private-driver authentication.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/build-private-driver.yml
    secrets:
      TPS43_DRIVER_READ_TOKEN: ${{ secrets.TPS43_DRIVER_READ_TOKEN }}
    with:
      build_matrix_path: build.yaml
      archive_name: sweep-pro-firmware
      patch_modules: |
        zmk-feature-codex-micro
        zmk-vfx-sweep-pro-display
