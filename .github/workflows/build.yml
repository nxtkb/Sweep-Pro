name: Build firmware

on:
  push:
    branches: [main, tps65]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # The module-owned workflow applies its version-matched ZMK compatibility
    # patch before building. Pinning it keeps the module and build procedure in sync.
    uses: nxtkb/zmk-feature-codex-micro/.github/workflows/build-user-config.yml@c53c81697e72ade603e84e7f3c8c5e43a04ddf4c
    with:
      build_matrix_path: build.yaml
      archive_name: sweep-pro-firmware
      patch_modules: |
        zmk-feature-codex-micro
        zmk-vfx-sweep-pro-display
