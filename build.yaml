# This file generates the GitHub Actions matrix.
# For simple board + shield combinations, add them to the top level board and
# shield arrays, for more control, add individual board + shield combinations
# to the `include` property. You can also use the `cmake-args` property to
# pass flags to the build command, `snippet` to add a Zephyr snippet, and
# `artifact-name` to assign a name to distinguish build outputs from each other:
#
---
include:
- board: nice_nano//zmk
  shield: sweep_left sweep_studio_sensors
  snippet: studio-rpc-usb-uart studio-sensors-local nxtkb-codex-micro-usb nxtkb-codex-micro-ble nxtkb-codex-micro-compat-identity
  artifact-name: sweep_left
  cmake-args: >-
    -DEXTRA_CONF_FILE="$zmk_config/discovery/discovery.conf"
    -DEXTRA_DTC_OVERLAY_FILE="$zmk_config/discovery/base.overlay"
- board: nice_nano//zmk
  shield: sweep_left sweep_left_display_hw sweep_display sweep_studio_sensors
  snippet: studio-rpc-usb-uart studio-sensors-local nxtkb-codex-micro-usb nxtkb-codex-micro-ble nxtkb-codex-micro-compat-identity
  artifact-name: sweep_left_display
  cmake-args: >-
    -DEXTRA_CONF_FILE="$zmk_config/discovery/discovery.conf"
    -DEXTRA_DTC_OVERLAY_FILE="$zmk_config/discovery/base.overlay;$zmk_config/discovery/display.overlay"
- board: nice_nano//zmk
  shield: sweep_left sweep_studio_sensors
  snippet: studio-rpc-usb-uart studio-sensors-local nxtkb-codex-micro-usb nxtkb-codex-micro-ble nxtkb-codex-micro-compat-identity
  artifact-name: sweep_left_trackpad
  cmake-args: >-
    -DEXTRA_CONF_FILE="$zmk_config/discovery/discovery.conf"
    -DEXTRA_DTC_OVERLAY_FILE="$zmk_config/discovery/base.overlay;$zmk_config/discovery/trackpad.overlay"
- board: nice_nano//zmk
  shield: sweep_left sweep_left_display_hw sweep_display sweep_studio_sensors
  snippet: studio-rpc-usb-uart studio-sensors-local nxtkb-codex-micro-usb nxtkb-codex-micro-ble nxtkb-codex-micro-compat-identity
  artifact-name: sweep_left_display_trackpad
  cmake-args: >-
    -DEXTRA_CONF_FILE="$zmk_config/discovery/discovery.conf"
    -DEXTRA_DTC_OVERLAY_FILE="$zmk_config/discovery/base.overlay;$zmk_config/discovery/display.overlay;$zmk_config/discovery/trackpad.overlay"
- board: nice_nano//zmk
  shield: sweep_right
  artifact-name: sweep_right
- board: nice_nano//zmk
  shield: sweep_right sweep_right_trackpad
  artifact-name: sweep_right_trackpad
- board: nice_nano//zmk
  shield: settings_reset
  artifact-name: settings_reset
